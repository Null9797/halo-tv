<body>

  <header class="site-header"><div class="wrap header-inner header-inner-compact">
    <a class="brand" href="/" aria-label="HaloTV 首页"><img src="/images/brand/halotv.png" width="42" height="42" alt=""><span>HaloTV</span></a>

  <main class="document body-copy" id="content">
    <a class="breadcrumb" href="/#install">← 安装与帮助</a>
    <h1>更新与桌面守护</h1>
    <p class="intro">遇到问题时，先升级至最新版。升级后仍反复异常时，可先保存重要素材并记录设置，再重装并按电视系统重新配置桌面守护。</p>
    <section class="panel" aria-labelledby="copy-title">
      <h2 id="copy-title">在电脑上安装和配置</h2>
      <p>先填写电视型号和 IP 地址，再把下方指令复制给可以执行 ADB 的电脑端 AI 助手。电脑与电视需连接同一个局域网。</p>
      <label for="ai-prompt">安装与桌面守护指令</label>
      <textarea id="ai-prompt" spellcheck="false">请通过 ADB 帮我安装最新版 HaloTV，并配置桌面守护。

电视品牌型号：【填写】
电视 IP 地址：【填写】

官网：https://halo-tv.pages.dev/
安装教程：https://github.com/Null9797/halo-tv/blob/main/INSTALL.md

请先检查电视的 Android 版本和当前 HaloTV 类型，选择适合的 Standard、Guard 或 Lite 安装包，并指导我开启 ADB、完成连接授权。

如果需要卸载重装，请先告知数据清除范围，确认旧应用确为 HaloTV 后再操作，不要误删 Aerial 或系统桌面。

安装后，请按当前版本和电视支持情况，配置默认桌面、桌面守护、守护自动恢复、开机启动及必要权限。Standard / Guard 请使用 HaloTV 仓库的独立版守护工具，不要套用 Aerial 的安装脚本或旧包名；Lite 仅配置其支持的默认桌面与启动功能。

最后检查守护是否实际运行，并协助我验证 Home 键返回桌面的效果。遇到系统限制请说明原因，不要禁用系统桌面，也不要修改无关设置。</textarea>
      <button class="button button-primary" id="copy" type="button">复制指令</button>
      <p id="copy-status" class="status" role="status" aria-live="polite"></p>
      <p class="note">部分权限需在电视上确认。卸载会清除应用数据。</p>
    </section>
    <p class="context-links"><a href="/#download">下载最新版</a><a href="https://github.com/Null9797/halo-tv/blob/main/INSTALL.md">详细安装教程</a></p>
  </main>
  <footer class="site-footer"><div class="wrap footer-inner">

  </div></footer>
<script>document.getElementById('copy').addEventListener('click',async()=>{const field=document.getElementById('ai-prompt'),status=document.getElementById('copy-status');try{if(!navigator.clipboard||!navigator.clipboard.writeText)throw new Error('clipboard unavailable');await navigator.clipboard.writeText(field.value);status.textContent='已复制，请粘贴到电脑端 AI 助手。';}catch(e){field.focus();field.select();status.textContent='已选中指令，请长按文字或使用电脑复制快捷键复制。';}});</script>
