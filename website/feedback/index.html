<head>
  <meta charset="utf-8">

  <meta name="referrer" content="no-referrer">
  <title>问题反馈 · HaloTV</title>

<body>
  <a class="skip" href="#content">跳至正文</a>
  <header class="site-header"><div class="wrap header-inner header-inner-compact">
    <a class="brand" href="/" aria-label="HaloTV 首页"><img src="/images/brand/halotv.png" width="42" height="42" alt=""><span>HaloTV</span></a>
    <a class="button button-small button-outline header-download" href="/#download">下载</a>
  </div></header>
  <main class="document body-copy" id="content">
    <a class="breadcrumb" href="/#faq">← 安装与帮助</a>
    <h1>问题反馈</h1>
    <p class="intro">HaloTV 通过 GitHub Issues 收集反馈。你可以查阅已有处理进度，也可以报告新问题。</p>
    <div class="actions">
      <a class="button button-primary" href="https://github.com/Null9797/halo-tv/issues/new?template=bug_report.yml" rel="noreferrer">提交问题 ↗</a>
      <a class="button button-outline" href="https://github.com/Null9797/halo-tv/issues" rel="noreferrer">查看已有问题 ↗</a>
    </div>
    <section class="panel" aria-labelledby="report-title">
      <h2 id="report-title">提交时请附上</h2>
      <ul><li>电视品牌、型号及 Android 版本</li><li>HaloTV 版本和安装类型</li><li>复现步骤、实际结果及预期表现</li></ul>
      <p class="note">GitHub 问题公开可见。发布截图或日志前，请遮掉二维码、IP、账号等个人信息。</p>
    </section>
  </main>
  <footer class="site-footer"><div class="wrap footer-inner">
    <p class="affiliation">HaloTV 基于 <a href="https://github.com/pengchujin/aerial-tv">Aerial</a> 二次开发，感谢原作者和开源贡献者。</p>
  </div></footer>
</body>
</html>
